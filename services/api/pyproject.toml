[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeflow-api"
version = "0.1.0"
description = "ForgeFlow orchestration API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.135.3,<0.136",
  "uvicorn>=0.44.0,<0.45",
  "pydantic>=2.12.5,<2.13",
  "sqlmodel>=0.0.38,<0.0.39",
  "httpx>=0.28.1,<0.29",
  "sse-starlette>=2.4.1,<3",
  "python-multipart>=0.0.20,<0.1",
  "huggingface_hub>=0.35.0",
  "pillow>=11.0.0",
  "python-slugify>=8.0.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<9.1",
  "pytest-asyncio>=1.2.0,<1.3"
]
local = [
  "torch>=2.5.0",
  "transformers>=4.57.0",
  "diffusers>=0.35.2",
  "accelerate>=1.10.0",
  "bitsandbytes>=0.49.2",
  "safetensors>=0.6.0",
  "rembg>=2.0.67",
  "trimesh>=4.7.4",
  "sentencepiece>=0.2.1"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/forgeflow_api/tests"]

[tool.setuptools.packages.find]
where = ["src"]
